<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=1823, height=863, initial-scale=1.0" name="viewport"/>
<title>UNIVIEW System Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="fonts">
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', sans-serif;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'navy-dark': '#001529',
            'cyan-bright': '#00e5ff',
            'sidebar-bg': '#f3f7fb',
            'sidebar-active-bg': '#e6f0fa',
            'sidebar-text-active': '#1677ff',
            'sidebar-text-muted': '#666666',
            'main-bg': '#f0f2f5',

            'text-secondary': '#666666',

            'btn-primary-bg': '#1677ff',

<style data-purpose="custom-styles">
    /* Global reset for exact dimensions */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1823px;
      height: 863px;
      overflow: hidden;
      background-color: #f0f2f5;
    }

    /* Topbar glowing effects */
    .topbar-shell {
      overflow: hidden;
      background:
        radial-gradient(circle at 28% -18%, rgba(33, 118, 196, 0.22) 0, rgba(33, 118, 196, 0) 36%),
        radial-gradient(circle at 82% 16%, rgba(0, 229, 255, 0.14) 0, rgba(0, 229, 255, 0) 30%),
        linear-gradient(180deg, #062344 0%, #031a34 58%, #02162c 100%) !important;
      border-bottom-color: rgba(0, 229, 255, 0.86) !important;
      box-shadow:
        inset 0 -1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -18px 36px rgba(0, 0, 0, 0.16);
    }

    .topbar-shell::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 80px),
        linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 70px);
      opacity: 0.14;
      pointer-events: none;
    }

    .topbar-shell::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 4px;
      background: linear-gradient(90deg, rgba(0,229,255,0.92), rgba(0,162,255,0.72) 58%, rgba(0,229,255,0.58));
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.64);
      pointer-events: none;
    }

    .brand-lockup h1 {
      text-shadow:
        0 0 1px rgba(255, 255, 255, 0.85),
        0 0 18px rgba(126, 192, 255, 0.28);
    }

    .brand-lockup span {
      color: rgba(205, 219, 235, 0.9);
      text-shadow: 0 0 16px rgba(96, 166, 255, 0.14);
    }

    .top-tab-active {
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3) inset;
      position: relative;
    }
    .top-tab-active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00e5ff, transparent);
      box-shadow: 0 0 8px #00e5ff;
    }

    /* Scheme 05: line-only L corner aligned to the left navigation bounds. */
    .nav-line-corner {
      position: absolute;
      left: 0;
      top: 154px;
      width: 100%;
      height: 94px;
      z-index: 32;
      pointer-events: none;
    }

    .nav-line-corner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.34), rgba(0, 229, 255, 0.76) 84%, rgba(0, 229, 255, 0.46));
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.42);
    }

    .nav-line-corner::after {
      content: '';
      position: absolute;
      left: 536px;
      top: 0;
      width: 2px;
      height: 94px;
      background: linear-gradient(180deg, rgba(0, 229, 255, 0.72), rgba(190, 205, 222, 0.5));
      box-shadow:
        0 0 9px rgba(0, 229, 255, 0.38),
        -5px 0 10px rgba(0, 24, 48, 0.08);
    }

    .nav-line-corner-accent {
      position: absolute;
      left: 520px;
      top: 0;
      width: 16px;
      height: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-right: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* Sidebar Gradient */
    .sidebar-bg {
      background: linear-gradient(180deg, #f8fbfd 0%, #ffffff 100%);
    }
  </style>
</head>
<body class="relative">
<!-- BEGIN: Topbar -->

<button class="bg-white border border-btn-border text-text-primary h-[74px] px-[32px] rounded-lg text-[26px] flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors">
