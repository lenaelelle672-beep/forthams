<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>固定资产 Workbench 导航草图</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --panel-soft: #f9fbfb;
      --line: #d9e1e4;
      --text: #172026;
      --muted: #66757f;
      --primary: #0f766e;
      --primary-soft: #e5f4f1;
      --blue: #2563eb;
      --amber: #b7791f;
      --red: #c2410c;
      --shadow: 0 14px 40px rgba(24, 39, 48, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #132c2b;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 1px;
    }

    .top-nav button,
    .utility button,
    .side button,
    .toolbar button,
    .table-actions button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }

    .top-nav button {
      min-width: 128px;
      padding: 9px 12px;
      text-align: center;
      white-space: nowrap;
    }

    .top-nav button.is-active {
      border-color: rgba(15, 118, 110, 0.35);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .utility {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .utility button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      padding: 18px;
      min-height: 0;
    }

    .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: calc(100vh - 96px);
    }

    .side-header {
      padding: 4px 4px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .side-header span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .side-header strong {
      display: block;
      font-size: 18px;
    }

    .side nav {
      display: grid;
      gap: 6px;
    }

    .side-section {
      margin-top: 12px;
    }

    .side-section:first-child {
      margin-top: 0;
    }

    .side-section-title {
      padding: 8px 4px 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .side button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 10px 11px;
      text-align: left;
    }

    .side .side-section-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 4px;
      font-size: 12px;
      font-weight: 800;
    }

    .side .side-section-toggle.is-open {
      color: var(--text);
    }

    .side-items {
      display: none;
      gap: 6px;
    }

    .side-section.is-open .side-items {
      display: grid;
    }

    .side button.is-active {
      border-color: rgba(15, 118, 110, 0.35);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .badge {
      min-width: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef3f5;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .main {
      min-width: 0;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .page-head {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.25;
    }

    .page-head p {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 760px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .toolbar button {
      padding: 9px 12px;
      white-space: nowrap;
    }

    .toolbar button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 20px;
    }

    .stat small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-head h2 {
      font-size: 16px;
    }

    .panel-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 140px 140px auto;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .filter-row input,
    .filter-row select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px 10px;
      color: var(--text);
    }

    .filter-row button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #fbfcfc;
    }

    td {
      color: #27343b;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: #f2f6f7;
      color: var(--muted);
      white-space: nowrap;
    }

    .tag.green {
      background: #e8f6ef;
      border-color: #bee3d0;
      color: #047857;
    }

    .tag.blue {
      background: #ebf2ff;
      border-color: #c8d9ff;
      color: var(--blue);
    }

    .tag.amber {
      background: #fff7e6;
      border-color: #f2d28b;
      color: var(--amber);
    }

    .tag.red {
      background: #fff0e8;
      border-color: #f4c0aa;
      color: var(--red);
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .table-actions button {
      padding: 6px 8px;
      color: var(--primary);
      background: #fff;
    }

    .detail {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .detail-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-soft);
    }

    .detail-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .detail-box strong {
      display: block;
      line-height: 1.45;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 1040px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .utility {
        justify-content: flex-start;
      }

      .body,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .side {
        min-height: auto;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .body {
        padding: 10px;
      }

      .page-head,
      .filter-row {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">FA</div>
        <div>
          <strong>固定资产管理系统</strong>
          <span>Workbench IA preview</span>
        </div>
      </div>
      <nav class="top-nav" id="topNav" aria-label="顶部导航"></nav>
      <div class="utility" aria-label="顶部工具">
        <button type="button" title="消息">铃</button>
        <button type="button" title="用户">我</button>
      </div>
    </header>

    <div class="body">
      <aside class="side">
        <div class="side-header">
          <span id="sideKicker">固定业务导航</span>
          <strong id="sideTitle">左侧与顶部不联动</strong>
        </div>
        <nav id="sideNav" aria-label="左侧二级导航"></nav>
      </aside>

      <main class="main">
        <section class="page-head">
          <div>
            <div class="eyebrow" id="eyebrow">工作概览 / 常用报表</div>
            <h1 id="pageTitle">常用报表</h1>
            <p id="pageDesc">常用报表放在工作概览下；业务专属报表仍跟随各自业务模块。</p>
          </div>
          <div class="toolbar">
            <button type="button">保存视图</button>
            <button type="button">导出</button>
            <button type="button" class="primary">新建报表</button>
          </div>
        </section>

        <section class="stats" id="stats"></section>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2 id="tableTitle">报表清单</h2>
                <span id="tableHint">以表格为主，指标只作为筛选与状态辅助。</span>
              </div>
              <span id="tableCount">12 项</span>
            </div>
            <div class="filter-row">
              <input id="searchInput" aria-label="当前页面搜索" placeholder="搜索名称、编号、负责人" />
              <select aria-label="类型">
                <option>全部类型</option>
                <option>运营</option>
                <option>业务</option>
                <option>数据</option>
                <option>风险</option>
              </select>
              <select aria-label="状态">
                <option>全部状态</option>
                <option>常用</option>
                <option>草稿</option>
                <option>需复核</option>
              </select>
              <button type="button">筛选</button>
            </div>
            <table>
              <thead>
                <tr>
                  <th style="width: 28%;">名称</th>
                  <th style="width: 15%;">归属</th>
                  <th style="width: 16%;">更新时间</th>
                  <th style="width: 17%;">状态</th>
                  <th style="width: 24%;">操作</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <aside class="panel">
            <div class="panel-head">
              <div>
                <h2>右侧详情抽屉</h2>
                <span>点击表格行后的信息承载区</span>
              </div>
            </div>
            <div class="detail" id="detailPanel"></div>
          </aside>
        </section>
      </main>
    </div>
  </div>

    const moduleContent = {

          ['DING_NOTICE', '钉钉通知', '待办提醒', '启用', '查看渠道,编辑模板']
        ],
        detail: [
          ['模块边界', '系统配置 / 消息与通知 / 邮件网关配置'],
          ['发送链路', '流程事件 -> 通知规则 -> 模板 -> 邮件网关 -> 邮件日志。'],
          ['安全要求', '敏感认证信息只保存密文，不在日志明文输出。']
        ]
      },
      'system-base': {
        title: '基础参数',
        desc: '系统级参数统一放在系统参数下，不再设置后台首页。',
        table: '系统参数清单',
        hint: '常用参数包括附件大小、导入批量、默认时区、安全策略等。',
        stats: [
          ['参数组', '6', '基础/安全/文件/导入'],
          ['审计', '开启', '参数变更留痕'],
          ['缓存', '可刷新', '按配置项生效'],
          ['权限', '管理员', '按角色控制']
        ],
        rows: [
          ['asset.numbering.previewLimit', '编号预览数量', '100', '启用', '编辑,查看日志'],
          ['file.upload.maxSize', '附件大小上限', '50MB', '启用', '编辑,查看日志'],
          ['import.batch.maxRows', '导入最大行数', '5000', '启用', '编辑,查看日志']
        ],
        detail: [
          ['模块边界', '系统配置 / 系统参数 / 基础参数'],
          ['设计原则', '系统参数承接后台通用设置，不承接业务待办。'],
          ['审计要求', '所有参数变更记录修改前后值、操作人和时间。']
        ]
      }
    };

    const fallbackContent = {
      title: '业务表格模块',
      desc: '该二级导航按同样模式展开：筛选栏、主表、详情抽屉和行操作。',
      table: '业务清单',
      hint: '这里展示 IA 原型，不承载真实数据。',
      stats: [
        ['列表项', '24', '示意数据'],
        ['待处理', '6', '按状态筛选'],
        ['本周新增', '9', '来自业务 API'],
        ['可导出', '是', '按权限控制']
      ],
      rows: [
        ['DEMO-001 示例记录', '当前模块', '今天 09:00', '待处理', '详情,编辑,导出'],
        ['DEMO-002 示例记录', '当前模块', '昨天 16:20', '处理中', '详情,流转,备注'],
        ['DEMO-003 示例记录', '当前模块', '周一 11:10', '已完成', '详情,归档,报表']
      ],
      detail: [
        ['模块边界', '跟随当前左侧二级导航'],
        ['页面形态', '表格主导，摘要和 KPI 只作为辅助状态。'],
        ['报表策略', '业务专属报表留在业务模块工具区。']
      ]
    };

    const topNav = document.getElementById('topNav');
    const sideNav = document.getElementById('sideNav');
    const sideTitle = document.getElementById('sideTitle');
    const sideKicker = document.getElementById('sideKicker');
    const eyebrow = document.getElementById('eyebrow');
    const pageTitle = document.getElementById('pageTitle');
    const pageDesc = document.getElementById('pageDesc');
    const stats = document.getElementById('stats');
    const tableTitle = document.getElementById('tableTitle');
    const tableHint = document.getElementById('tableHint');
    const tableCount = document.getElementById('tableCount');
    const tableBody = document.getElementById('tableBody');
    const detailPanel = document.getElementById('detailPanel');

    let activeTop = 'overview';
    let activeItem = 'reports';

    function getCurrentNav() {
      return activeTop === 'system' ? ADMIN_NAV : BUSINESS_NAV;
    }

    function getBusinessIds() {
      return BUSINESS_NAV.flatMap((group) => group.items).map((item) => item.id);
    }

    function getAdminIds() {
      return ADMIN_NAV.flatMap((group) => group.items).map((item) => item.id);
    }

    function findGroupForItem(nav, itemId) {
      return nav.find((group) => group.items.some((item) => item.id === itemId)) || nav[0];
    }

    function tagClass(value) {
      if (value.includes('成功') || value.includes('常用') || value.includes('准备')) return 'green';
      if (value.includes('失败') || value.includes('高')) return 'red';
      if (value.includes('复核') || value.includes('缺失') || value.includes('中')) return 'amber';
      return 'blue';
    }

    function getContent(itemId) {
      return moduleContent[itemId] || fallbackContent;
    }

    function renderTop() {
      topNav.innerHTML = Object.entries(TOP_VIEWS).map(([id, item]) => `
        <button type="button" class="${id === activeTop ? 'is-active' : ''}" data-top="${id}">
          ${item.label}
        </button>
      `).join('');
    }

    function renderSide() {
      const nav = getCurrentNav();
      const openGroup = findGroupForItem(nav, activeItem);
      const isSystem = activeTop === 'system';
      sideKicker.textContent = isSystem ? '后台管理导航' : '业务导航';
      sideTitle.textContent = isSystem ? '系统配置模式' : '业务模式';
      sideNav.innerHTML = nav.map((group) => `
        <div class="side-section ${group.id === openGroup.id ? 'is-open' : ''}">
          <button type="button" class="side-section-toggle ${group.id === openGroup.id ? 'is-open' : ''}" data-group="${group.id}">
            <span>${group.title}</span>
            <span>${group.id === openGroup.id ? '收起' : '展开'}</span>
          </button>
          <div class="side-items">
            ${group.items.map((item) => `
              <button type="button" class="${item.id === activeItem ? 'is-active' : ''}" data-item="${item.id}">
                <span>${item.label}</span>
                <span class="badge">${item.count}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderContent() {
      const current = TOP_VIEWS[activeTop];
      const nav = getCurrentNav();
      const sideItem = nav.flatMap((group) => group.items).find((item) => item.id === activeItem);
      const content = getContent(activeItem);
      const modeText = activeTop === 'system'
        ? '系统配置是独立后台模式，所以左侧会切换为管理端导航。'
        : '顶部四个是业务快速视角，不过滤、不重排左侧业务导航。';

      eyebrow.textContent = `顶部视角：${current.label} · 左侧模块：${sideItem ? sideItem.label : content.title}`;
      pageTitle.textContent = content.title;
      pageDesc.textContent = `${content.desc} ${modeText}${current.desc}`;
      tableTitle.textContent = content.table;
      tableHint.textContent = content.hint;
      tableCount.textContent = `${content.rows.length} 项`;

      stats.innerHTML = content.stats.map((item) => `
        <div class="stat">
          <span>${item[0]}</span>
          <strong>${item[1]}</strong>
          <small>${item[2]}</small>
        </div>
      `).join('');

      tableBody.innerHTML = content.rows.map((row) => `
        <tr>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td><span class="tag ${tagClass(row[3])}">${row[3]}</span></td>
          <td>
            <div class="table-actions">
              ${row[4].split(',').map((action) => `<button type="button">${action}</button>`).join('')}
            </div>
          </td>
        </tr>
      `).join('');

      detailPanel.innerHTML = content.detail.map((item) => `
        <div class="detail-box">
          <span>${item[0]}</span>
          <strong>${item[1]}</strong>
        </div>
      `).join('') + `
        <p class="note">这个 HTML 用来确认导航与承载边界：顶部前四个是业务快速视角；系统配置是后台模式切换；左侧用折叠分组承载具体业务。</p>
      `;
    }

    function renderAll() {
      renderTop();
      renderSide();
      renderContent();
    }

    topNav.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-top]');
      if (!button) return;
      activeTop = button.dataset.top;
      if (activeTop === 'system' && !getAdminIds().includes(activeItem)) {
        activeItem = 'flow-definition';
      }
      if (activeTop !== 'system' && !getBusinessIds().includes(activeItem)) {
        activeItem = 'reports';
      }
      renderAll();
    });

    sideNav.addEventListener('click', (event) => {
      const groupButton = event.target.closest('button[data-group]');
      if (groupButton) {
        const group = getCurrentNav().find((item) => item.id === groupButton.dataset.group);
        if (group && group.items[0]) {
          activeItem = group.items[0].id;
          renderAll();
        }
        return;
      }

      const button = event.target.closest('button[data-item]');
      if (!button) return;
      activeItem = button.dataset.item;
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
