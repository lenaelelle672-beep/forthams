server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: asset-management-system

  # ========== DataSource ==========
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ams_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowEmptyPasswords=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: AMSHikariCP

  # ========== JPA ==========
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ========== Jackson ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ========== Multipart 文件上传配置 (SWARM-P2-006 批量导入导出) ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ams.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== Flyway 数据库迁移 ==========
# 此前 migration/ 目录未接入运行时，schema.sql 需手动执行。
# 接入 Flyway 后，启动时自动执行 migration/ 下的 V2_*.sql。
# baseline-on-migrate=true：对已有表（schema.sql 手动建过的）安全，仅执行增量。
spring.flyway.enabled: true
spring.flyway.locations: classpath:migration
spring.flyway.baseline-on-migrate: true
spring.flyway.baseline-version: 0
spring.flyway.table: flyway_schema_history

# ========== JWT ==========
jwt:
  secret: ${JWT_SECRET:ams-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.ams: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
