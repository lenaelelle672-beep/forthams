server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: asset-management-system

  # ========== DataSource ==========
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: AMSHikariCP

  # ========== JPA ==========
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ========== Jackson ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ========== Multipart 文件上传配置 (SWARM-P2-006 批量导入导出) ==========
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ams.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== Flyway 数据库迁移 ==========
# 此前 migration/ 目录未接入运行时，schema.sql 需手动执行。
# 应用进程永不执行迁移。受控发布只能由独立 DBA 工具在 preflight、备份和独立复核后执行。
# 新库必须使用经审计的 staged migration chain；已部署库不得依赖自动 baseline 或自动 repair。
spring.flyway.enabled: false
spring.flyway.locations: classpath:migration
spring.flyway.baseline-on-migrate: false
spring.flyway.baseline-version: 0
spring.flyway.table: flyway_schema_history

# ========== 应用自定义配置 ==========
app:
  database:
    # MySQL 默认必须使用 TLS。仅 loopback 本地开发可显式同时设置
    # DB_REQUIRE_TLS=false 和 DB_ALLOW_INSECURE_LOCAL_DEV=true 作为受控例外。
    require-tls: ${DB_REQUIRE_TLS:true}
    allow-insecure-local-dev: ${DB_ALLOW_INSECURE_LOCAL_DEV:false}
  security:
    login-rate-limit:
      # 生产默认且仅默认使用跨实例共享的数据库 tracker；memory 仅允许显式 test/dev profile。
      tracker: ${LOGIN_RATE_LIMIT_TRACKER:database}
      identifier-secret: ${LOGIN_RATE_LIMIT_IDENTIFIER_SECRET:${JWT_SECRET}}
      max-entries: ${LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}
      failures-before-backoff: ${LOGIN_RATE_LIMIT_FAILURES_BEFORE_BACKOFF:5}
      base-delay-seconds: ${LOGIN_RATE_LIMIT_BASE_DELAY_SECONDS:1}
      max-delay-seconds: ${LOGIN_RATE_LIMIT_MAX_DELAY_SECONDS:900}
      retention-seconds: ${LOGIN_RATE_LIMIT_RETENTION_SECONDS:86400}
      reservation-seconds: ${LOGIN_RATE_LIMIT_RESERVATION_SECONDS:120}
  # CORS 允许的来源（逗号分隔）。dev 默认 localhost，staging/prod 可通过环境变量
  # APP_CORS_ALLOWED_ORIGINS 或此处的占位符覆盖。
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ========== JWT ==========
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.ams: INFO
    com.ams.mapper: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ams.log

# ========== MyBatis-Plus 补充（从 application.properties 合并，消除双文件冲突） ==========
# cache-enabled 和 id-type 原仅在 .properties 中定义，合并后 .properties 可安全精简
mybatis-plus.configuration.cache-enabled: false
mybatis-plus.global-config.db-config.id-type: auto
