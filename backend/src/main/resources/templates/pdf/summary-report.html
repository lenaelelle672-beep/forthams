<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>资产报表</title>
  <style>
    @page {
      size: A4;
      margin: 2cm;
    }
    body {
      font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 12px;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      color: #1d4ed8;
      font-size: 20px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    th, td {
      padding: 8px 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
    }
    .footer {
      text-align: center;
      color: #999;
      font-size: 10px;
      margin-top: 30px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .header-info {
      text-align: right;
      color: #666;
      font-size: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="header-info" th:text="'生成时间：' + ${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
    生成时间：2026-06-03
  </div>
  <h1>资产汇总报表</h1>
  <table>
    <tr>
      <th>指标</th>
      <th>数值</th>
    </tr>
    <tr>
      <td>资产总数</td>
      <td th:text="${totalAssets}">0</td>
    </tr>
    <tr>
      <td>在库资产</td>
      <td th:text="${activeAssets}">0</td>
    </tr>
    <tr>
      <td>待审批</td>
      <td th:text="${pendingApproval}">0</td>
    </tr>
    <tr>
      <td>已退役</td>
      <td th:text="${recentlyRetired}">0</td>
    </tr>
  </table>
  <div class="footer">
    forthAMS 资产管理系统 — 自动生成报表
  </div>
</body>
</html>
