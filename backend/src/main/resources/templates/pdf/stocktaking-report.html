<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>盘点报告</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 1.5cm;
    }
    body {
      font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 10px;
      color: #333;
      line-height: 1.5;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      color: #059669;
      font-size: 18px;
      margin: 0 0 6px 0;
    }
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #666;
      font-size: 9px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #059669;
    }
    .summary-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #f0fdf4;
      border-radius: 6px;
      border: 1px solid #bbf7d0;
    }
    .summary-item {
      text-align: center;
    }
    .summary-item .label {
      font-size: 9px;
      color: #64748b;
    }
    .summary-item .value {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
    }
    th, td {
      padding: 5px 8px;
      text-align: left;
      border: 1px solid #ddd;
      font-size: 9px;
      white-space: nowrap;
    }
    th {
      background-color: #059669;
      color: #fff;
      font-weight: 600;
      font-size: 9px;
    }
    tr:nth-child(even) {
      background-color: #f0fdf4;
    }
    tr:hover {
      background-color: #ecfdf5;
    }
    .status-completed { color: #16a34a; font-weight: 600; }
    .status-pending   { color: #d97706; font-weight: 600; }
    .status-counted   { color: #3b82f6; font-weight: 600; }
    .variance-positive { color: #16a34a; }
    .variance-negative { color: #dc2626; }
    .variance-zero     { color: #6b7280; }
    .footer {
      text-align: center;
      color: #999;
      font-size: 8px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="header-info">
    <span>forthAMS 资产管理系统</span>
    <span th:text="'打印时间：' + ${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">打印时间</span>
  </div>

  <h1>盘点报告</h1>

  <!-- 盘点周期信息 -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="label">盘点名称</div>
      <div class="value" th:text="${cycleName}">-</div>
    </div>
    <div class="summary-item">
      <div class="label">盘点类型</div>
      <div class="value" th:text="${cycleType}">-</div>
    </div>
    <div class="summary-item">
      <div class="label">开始日期</div>
      <div class="value" th:text="${startDate}">-</div>
    </div>
    <div class="summary-item">
      <div class="label">结束日期</div>
      <div class="value" th:text="${endDate}">-</div>
    </div>
    <div class="summary-item">
      <div class="label">状态</div>
      <div class="value" th:text="${status}">-</div>
    </div>
  </div>

  <!-- 盘点汇总 -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="label">任务总数</div>
      <div class="value" th:text="${totalTasks}">0</div>
    </div>
    <div class="summary-item">
      <div class="label">已完成</div>
      <div class="value" th:text="${completedTasks}">0</div>
    </div>
    <div class="summary-item">
      <div class="label">待盘点</div>
      <div class="value" th:text="${pendingTasks}">0</div>
    </div>
    <div class="summary-item">
      <div class="label">已盘点</div>
      <div class="value" th:text="${countedTasks}">0</div>
    </div>
    <div class="summary-item">
      <div class="label">差异数量</div>
      <div class="value" th:text="${varianceCount}">0</div>
    </div>
    <div class="summary-item">
      <div class="label">盘点完成率</div>
      <div class="value" th:text="${completionRate} + '%'">0%</div>
    </div>
  </div>

  <!-- 盘点任务明细表 -->
  <table>
    <thead>
      <tr>
        <th>序号</th>
        <th>任务ID</th>
        <th>资产编号</th>
        <th>资产名称</th>
        <th>预期数量</th>
        <th>实际数量</th>
        <th>差异</th>
        <th>状态</th>
        <th>盘点人</th>
        <th>盘点时间</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="task, stat : ${tasks}">
        <td th:text="${stat.count}">1</td>
        <td th:text="${task?.id}">-</td>
        <td th:text="${task?.assetNo}">-</td>
        <td th:text="${task?.assetName}">-</td>
        <td th:text="${task?.expectedQuantity}">0</td>
        <td th:text="${task?.actualQuantity}">0</td>
        <td>
          <span th:if="${task?.variance > 0}" class="variance-positive" th:text="'+' + ${task?.variance}">+1</span>
          <span th:if="${task?.variance < 0}" class="variance-negative" th:text="${task?.variance}">-1</span>
          <span th:if="${task?.variance == 0}" class="variance-zero">0</span>
        </td>
        <td>
          <span th:if="${task?.status == 'PENDING'}" class="status-pending">待盘点</span>
          <span th:if="${task?.status == 'COUNTED'}" class="status-counted">已盘点</span>
          <span th:if="${task?.status == 'ADJUSTED'}" class="status-completed">已调整</span>
          <span th:if="${task?.status != 'PENDING' and task?.status != 'COUNTED' and task?.status != 'ADJUSTED'}" th:text="${task?.status}">-</span>
        </td>
        <td th:text="${task?.countedBy}">-</td>
        <td th:text="${task?.countTime}">-</td>
      </tr>
      <tr th:if="${tasks == null or #lists.isEmpty(tasks)}">
        <td colspan="10" style="text-align: center; color: #999;">暂无盘点任务数据</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p>forthAMS 资产管理系统 — 自动生成盘点报告</p>
  </div>
</body>
</html>
