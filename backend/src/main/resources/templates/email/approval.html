<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${subject} ?: '审批通知'">审批通知</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f6; padding: 20px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background: linear-gradient(135deg, #faad14 0%, #d48806 100%); border-radius: 8px 8px 0 0; padding: 30px 40px; text-align: center;">
                        <h1 style="color: #ffffff; margin: 0; font-size: 20px; font-weight: 600;" th:text="${subject} ?: '审批通知'">审批通知</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 30px 40px;">
                        <p style="font-size: 14px; color: #333333;" th:text="'您好，' + ${recipientName} ?: '您好，'">您好，</p>
                        <div style="font-size: 14px; line-height: 1.8; color: #333333;">
                            <p th:utext="${content}">审批内容</p>
                            <table th:if="${approvalDetails}" role="presentation" width="100%" cellpadding="8" cellspacing="0" style="margin-top: 16px; border: 1px solid #e8e8e8; border-radius: 4px;">
                                <tr th:each="entry : ${approvalDetails}">
                                    <td style="font-weight: 600; color: #555555; width: 120px;" th:text="${entry.key}">字段</td>
                                    <td style="color: #333333;" th:text="${entry.value}">值</td>
                                </tr>
                            </table>
                            <p th:if="${actionUrl}" style="margin-top: 20px; text-align: center;">
                                <a th:href="${actionUrl}" style="display: inline-block; padding: 10px 24px; background-color: #faad14; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 14px;">前往处理</a>
                            </p>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 20px 40px; border-top: 1px solid #e8e8e8; text-align: center; font-size: 12px; color: #999999;">
                        <p>资产管理（AMS）系统自动发送，请勿回复。</p>
                        <p th:if="${timestamp}" th:text="'发送时间: ' + ${timestamp}">发送时间: 2024-01-01 00:00:00</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
