<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${subject} ?: '定时报表'">定时报表</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f6; padding: 20px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%); border-radius: 8px 8px 0 0; padding: 30px 40px; text-align: center;">
                        <h1 style="color: #ffffff; margin: 0; font-size: 20px; font-weight: 600;" th:text="${subject} ?: '定时报表'">定时报表</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 30px 40px;">
                        <p style="font-size: 14px; color: #333333;" th:text="'您好，' + ${recipientName} ?: '您好，'">您好，</p>
                        <div style="font-size: 14px; line-height: 1.8; color: #333333;" th:utext="${content}">
                            报表内容
                        </div>
                        <p th:if="${reportUrl}" style="margin-top: 20px; text-align: center;">
                            <a th:href="${reportUrl}" style="display: inline-block; padding: 10px 24px; background-color: #1890ff; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 14px;">查看完整报表</a>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 20px 40px; border-top: 1px solid #e8e8e8; text-align: center; font-size: 12px; color: #999999;">
                        <p>资产管理（AMS）系统自动发送，请勿回复。</p>
                        <p th:if="${timestamp}" th:text="'发送时间: ' + ${timestamp}">发送时间: 2024-01-01 00:00:00</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
