# Application Configuration
spring.application.name=asset-management-system

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ams_db?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# MyBatis-Plus Configuration
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.ams.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.header=Authorization
jwt.token-prefix=Bearer 

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.ams=DEBUG
logging.level.com.ams.mapper=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n
logging.pattern.level=%X{traceId}
logging.file.name=logs/ams.log

# Actuator (Monitoring)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# i18n MessageSource
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# Permission cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=loginUser
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# =============================================================================
# 多租户配置
# =============================================================================
# 阶段 1：配置化默认租户 ID 列表（逗号分隔），与业务租户口径保持一致
ams.tenants.default-ids=dept:1

# =============================================================================
# RuoYi RBAC: 数据权限配置
# =============================================================================
ams.data-scope.enabled=true

# =============================================================================
# MaxKey SSO / OAuth2 配置
# =============================================================================
spring.security.oauth2.client.registration.maxkey.client-id=${MAXKEY_CLIENT_ID:forthams}
spring.security.oauth2.client.registration.maxkey.client-secret=${MAXKEY_CLIENT_SECRET:}
spring.security.oauth2.client.registration.maxkey.client-name=${MAXKEY_CLIENT_NAME:MaxKey SSO}
spring.security.oauth2.client.registration.maxkey.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.maxkey.redirect-uri={baseUrl}/login/oauth2/code/maxkey
spring.security.oauth2.client.registration.maxkey.scope=openid,profile,email

spring.security.oauth2.client.provider.maxkey.authorization-uri=${MAXKEY_AUTHORIZATION_URI:https://maxkey.example.com/authz/oauth/v20/authorize}
spring.security.oauth2.client.provider.maxkey.token-uri=${MAXKEY_TOKEN_URI:https://maxkey.example.com/authz/oauth/v20/token}
spring.security.oauth2.client.provider.maxkey.user-info-uri=${MAXKEY_USER_INFO_URI:https://maxkey.example.com/api/oauth/v20/me}
spring.security.oauth2.client.provider.maxkey.user-name-attribute=username

sso.mock.enabled=${SSO_MOCK_ENABLED:false}
sso.mock.default-username=${SSO_MOCK_DEFAULT_USERNAME:admin}
sso.redirect.frontend=${SSO_REDIRECT_FRONTEND:http://localhost:5173/sso-callback}

# =============================================================================
# Security: Error handling
# =============================================================================
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# =============================================================================
# Spring Mail (SMTP) — 邮件发送配置
# =============================================================================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =============================================================================
# Flyway Database Migration
# =============================================================================
spring.flyway.enabled=false
