# Real-backend Playwright E2E profile for spring-boot:test-run.
# Uses test classpath + H2, initializes the fresh-install schema snapshot,
# then applies H2-compatible fixes for MySQL dynamic ALTER sections.

spring.datasource.url=jdbc:h2:mem:e2edb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:e2e-h2-fixes.sql
spring.sql.init.continue-on-error=true

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

DB_PASSWORD=e2e_db_password
JWT_SECRET=E2E_SECRET_KEY_FOR_LOCAL_PLAYWRIGHT_ONLY
jwt.secret=E2E_SECRET_KEY_FOR_LOCAL_PLAYWRIGHT_ONLY
jwt.expiration=3600000

spring.mail.host=localhost
spring.mail.port=3025

ams.scheduling.enabled=false
ams.oper-log.enabled=true
ams.security.method-permission-test-bypass=true

logging.level.com.ams=DEBUG
logging.level.com.ams.common.GlobalExceptionHandler=OFF
