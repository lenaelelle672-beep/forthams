# Sprint 4 Validation CI/CD Workflow (重写)
#
# ISSUE-101: 从 Python 静态分析迁移到 Java 17 + Node 20 前后端验证
#
# 触发条件:
#   - PR 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 验证步骤:
#   - Java 17 编译检查 (mvn compile -q)
#   - 后端测试 (mvn test -q)
#   - Node 20 前端构建 (npm ci + npm run build)
#   - 前端测试 (npm test -- --run)
#   - TypeScript 类型检查 (tsc --noEmit)

name: Sprint 4 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/sprint4_validation.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Job 1: 后端验证（编译 + 测试）
  # ============================================================
  backend_validation:
    name: Backend Validation (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile backend
        run: mvn compile -q

      - name: Run backend tests
        run: mvn test -q

  # ============================================================
  # Job 2: 前端验证（构建 + 测试 + 类型检查）
  # ============================================================
  frontend_validation:
    name: Frontend Validation (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --run

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ============================================================
  # Job 3: 验收总结
  # ============================================================
  acceptance_summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      - backend_validation
      - frontend_validation
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate validation summary
        id: summary
        run: |
          echo "========================================"
          echo "Sprint 4 验证结果汇总"
          echo "========================================"
          echo ""

          backend_pass=${{ needs.backend_validation.result == 'success' && '✅' || '❌' }}
          frontend_pass=${{ needs.frontend_validation.result == 'success' && '✅' || '❌' }}

          echo "| 验证项 | 状态 |"
          echo "|--------|------|"
          echo "| Backend: Compile + Test | $backend_pass |"
          echo "| Frontend: Build + Test + TypeCheck | $frontend_pass |"
          echo ""

          if [ "$backend_pass" == "✅" ] && [ "$frontend_pass" == "✅" ]; then
            echo "🎉 所有验证已通过!"
            echo "validation_result=pass" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 部分验证未通过"
            echo "validation_result=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
